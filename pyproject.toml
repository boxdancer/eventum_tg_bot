[project]
name = "tg-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "python-dotenv>=1.1.1",
    "python-telegram-bot>=20.0,<21.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "ruff>=0.15.12,<1",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
