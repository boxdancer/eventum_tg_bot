[project]
name = "tg-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<2",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "python-dotenv>=1.1.1",
    "python-telegram-bot>=22.8,<23",
]

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "ruff>=0.15.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["bot", "constants", "alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
pretty = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
explicit_package_bases = true
